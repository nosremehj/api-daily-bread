# VPS / produção — use: SPRING_PROFILES_ACTIVE=prod
# Banco (ex.: Docker Compose na mesma máquina: host postgres, porta 5432)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bread}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bread}
# Deve coincidir com POSTGRES_PASSWORD do Docker; em VPS use segredo forte via env.
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bread_change_me}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

bread.seed-test-user=false
