# PostgreSQL (VPS / EasyPanel). Ative com SPRING_PROFILES_ACTIVE=prod ou spring.profiles.active=prod
#
# API como serviço Docker na mesma rede do Postgres (host interno do painel):
spring.datasource.url=${SPRING_DATASOURCE_URL}
#
# API rodando direto no host da VPS (JAR/systemd) com Postgres exposto em localhost:
# defina SPRING_DATASOURCE_URL=jdbc:postgresql://127.0.0.1:5432/daily-bread-db
#
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

bread.seed-test-user=false
