spring.application.name=bread

# --- Perfis ---
# dev → H2 em memória (application-dev.properties). Padrão quando nada é definido.
# prod → PostgreSQL na VPS (application-prod.properties).
#
# Forma recomendada na EasyPanel/VPS: defina só no painel a variável SPRING_PROFILES_ACTIVE=prod
# (e SPRING_DATASOURCE_*, BREAD_JWT_SECRET). Não commite senhas.
#
# Para forçar na sua máquina, descomente UMA linha abaixo:
spring.profiles.default=dev
#spring.profiles.active=dev
#spring.profiles.active=prod

# Local: 9090. Docker / VPS podem injetar PORT.
server.port=${PORT:9090}

spring.jpa.hibernate.ddl-auto=validate

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# JWT (em produção defina BREAD_JWT_SECRET; mínimo ~32 caracteres para HS256)
bread.jwt.secret=${BREAD_JWT_SECRET:bread-dev-jwt-secret-change-me-please-use-env-in-prod-32chars}
bread.jwt.expiration-ms=7200000
bread.jwt.refresh-expiration-ms=604800000
