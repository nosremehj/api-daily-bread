spring.application.name=bread
# Local: 9090. Render e outros hosts injetam PORT.
server.port=${PORT:9090}

# H2 (dev)
spring.datasource.url=jdbc:h2:mem:breaddb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123456

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate

spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# JWT (troque o secret em produção; mínimo ~32 caracteres para HS256)
bread.jwt.secret=${BREAD_JWT_SECRET:bread-dev-jwt-secret-change-me-please-use-env-in-prod-32chars}
# Access token: 2 horas
bread.jwt.expiration-ms=7200000
# Refresh token: 7 dias (ajuste conforme necessidade)
bread.jwt.refresh-expiration-ms=604800000
