services:
  postgres:
    image: postgres:16-alpine
    container_name: bread-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bread}
      POSTGRES_USER: ${POSTGRES_USER:-bread}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bread_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - bread_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bread-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bread}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bread}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bread_change_me}
      BREAD_JWT_SECRET: ${BREAD_JWT_SECRET:-troque-esta-chave-por-um-segredo-longo-aleatorio-32chars}

volumes:
  bread_pgdata:
